name: Yubrae
options:
  bundleIdPrefix: com.yubrae
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Yubrae:
    type: application
    platform: iOS
    sources:
      - path: Yubrae
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Yubrae
        INFOPLIST_FILE: Yubrae/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.yubrae.app
        ENABLE_APPINTENTS_DEPLOYMENT_AWARE_PROCESSING: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  YubraeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YubraeTests
    dependencies:
      - target: Yubrae
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yubrae.app.tests
        PRODUCT_NAME: YubraeTests
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

schemes:
  Yubrae:
    build:
      targets:
        Yubrae: all
        YubraeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YubraeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
