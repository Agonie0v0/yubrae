name: Yubrae Release CI (Android + iOS)

on:
  push:
    branches:
      - main
    paths-ignore: ["rules/**"]
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  meta:
    name: Detect Release Metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
      target_version: ${{ steps.resolve.outputs.target_version }}
      target_build_number: ${{ steps.resolve.outputs.target_build_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve version and release eligibility
        id: resolve
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          def read_text(path_str: str) -> str:
              return Path(path_str).read_text(encoding="utf-8")

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          gradle_text = read_text("app/build.gradle.kts")
          ios_text = read_text("ios/project.yml")

          m_android_ver = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', gradle_text, re.MULTILINE)
          m_android_code = re.search(r'^\s*versionCode\s*=\s*(\d+)', gradle_text, re.MULTILINE)
          m_ios_ver = re.search(r'^\s*MARKETING_VERSION:\s*"([^"]+)"', ios_text, re.MULTILINE)
          m_ios_code = re.search(r'^\s*CURRENT_PROJECT_VERSION:\s*"?(\d+)"?', ios_text, re.MULTILINE)

          android_ver = m_android_ver.group(1).strip() if m_android_ver else ""
          ios_ver = m_ios_ver.group(1).strip() if m_ios_ver else ""
          android_code = int(m_android_code.group(1)) if m_android_code else 0
          ios_code = int(m_ios_code.group(1)) if m_ios_code else 0

          if not android_ver or not ios_ver or android_code <= 0 or ios_code <= 0:
              fail(
                  f"Failed to parse version metadata: "
                  f"android_ver={android_ver!r}, android_code={android_code}, "
                  f"ios_ver={ios_ver!r}, ios_code={ios_code}"
              )

          if not re.fullmatch(r"\d+\.\d+\.\d+", android_ver):
              fail(f"Android versionName must be three-part semver (X.Y.Z), got {android_ver!r}")

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          github_ref = os.environ.get("GITHUB_REF", "")
          github_ref_name = os.environ.get("GITHUB_REF_NAME", "")

          commit_msg = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%B"], text=True
          ).strip()

          def write_outputs(outputs: dict[str, str]) -> None:
              out_path = os.environ.get("GITHUB_OUTPUT", "")
              if out_path:
                  with open(out_path, "a", encoding="utf-8") as fh:
                      for k, v in outputs.items():
                          fh.write(f"{k}={v}\n")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
              summary_lines = [
                  "### Release Metadata",
                  f"- `should_release`: `{outputs['should_release']}`",
                  f"- `target_version`: `{outputs['target_version']}`",
                  f"- `target_build_number`: `{outputs['target_build_number']}`",
                  f"- `release_tag`: `{outputs['release_tag']}`",
                  f"- `artifact_tag`: `{outputs['artifact_tag']}`",
              ]
              print("\n".join(summary_lines))
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(summary_lines) + "\n")

          def sanitize_ref(raw: str, fallback: str = "manual") -> str:
              return (raw or fallback).replace("/", "-")

          if event_name == "pull_request":
              safe_pr = sanitize_ref(github_ref_name, "pr")
              print(f"Pull request detected; artifact_tag=pr-{safe_pr}, release skipped.")
              write_outputs({
                  "should_release": "false",
                  "release_tag": "",
                  "artifact_tag": f"pr-{safe_pr}",
                  "target_version": android_ver,
                  "target_build_number": str(android_code),
              })
              sys.exit(0)

          if github_ref != "refs/heads/main":
              safe_ref = sanitize_ref(github_ref_name, "manual")
              print(f"Non-main ref ({github_ref or 'unknown'}); running CI verification only.")
              write_outputs({
                  "should_release": "false",
                  "release_tag": "",
                  "artifact_tag": safe_ref,
                  "target_version": android_ver,
                  "target_build_number": str(android_code),
              })
              sys.exit(0)

          if event_name == "push" and "[skip release]" in commit_msg.lower():
              print("Commit message contains [skip release]; running CI verification only.")
              write_outputs({
                  "should_release": "false",
                  "release_tag": "",
                  "artifact_tag": "main",
                  "target_version": android_ver,
                  "target_build_number": str(android_code),
              })
              sys.exit(0)

          if android_ver != ios_ver:
              fail(
                  f"Version mismatch for release baseline: "
                  f"Android versionName={android_ver}, iOS MARKETING_VERSION={ios_ver}."
              )

          base_tuple = tuple(int(p) for p in android_ver.split("."))

          raw_tags = subprocess.check_output(
              ["git", "ls-remote", "--tags", "origin", "refs/tags/v*"],
              text=True,
          )
          tag_tuples: list[tuple[int, int, int]] = []
          for line in raw_tags.splitlines():
              parts = line.strip().split()
              if len(parts) < 2:
                  continue
              ref = parts[1]
              if ref.endswith("^{}"):
                  ref = ref[:-3]
              m_tag = re.fullmatch(r"refs/tags/v(\d+)\.(\d+)\.(\d+)", ref)
              if m_tag:
                  tag_tuples.append(tuple(int(g) for g in m_tag.groups()))

          max_tag = max(tag_tuples) if tag_tuples else None
          if max_tag is None or base_tuple > max_tag:
              target_tuple = base_tuple
              reason = f"using source baseline {android_ver} (max remote tag: {max_tag})"
          else:
              target_tuple = (max_tag[0], max_tag[1], max_tag[2] + 1)
              reason = f"auto-bumped patch from max remote tag v{'.'.join(map(str, max_tag))}"

          if target_tuple[1] >= 1000 or target_tuple[2] >= 1000:
              fail(
                  f"Minor/patch component exceeds 999 in {target_tuple}; "
                  f"please bump minor or major version manually in app/build.gradle.kts and ios/project.yml."
              )

          calc_code = target_tuple[0] * 1_000_000 + target_tuple[1] * 1_000 + target_tuple[2]
          target_code = max(calc_code, android_code, ios_code)
          target_version = f"{target_tuple[0]}.{target_tuple[1]}.{target_tuple[2]}"
          release_tag = f"v{target_version}"

          print(f"Resolved target release {release_tag} (build {target_code}): {reason}")
          write_outputs({
              "should_release": "true",
              "release_tag": release_tag,
              "artifact_tag": release_tag,
              "target_version": target_version,
              "target_build_number": str(target_code),
          })
          PY

  android:
    name: Android Test & Release APK
    runs-on: ubuntu-latest
    needs: [meta]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject target version into Android build
        if: needs.meta.outputs.should_release == 'true'
        env:
          TARGET_VERSION: ${{ needs.meta.outputs.target_version }}
          TARGET_BUILD_NUMBER: ${{ needs.meta.outputs.target_build_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          target_ver = os.environ["TARGET_VERSION"]
          target_code = os.environ["TARGET_BUILD_NUMBER"]
          gradle_path = Path("app/build.gradle.kts")
          text = gradle_path.read_text(encoding="utf-8")

          text, cnt_code = re.subn(
              r'^(\s*versionCode\s*=\s*)\d+',
              rf'\g<1>{target_code}',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, cnt_ver = re.subn(
              r'^(\s*versionName\s*=\s*)"[^"]+"',
              rf'\g<1>"{target_ver}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if cnt_code != 1 or cnt_ver != 1:
              print(f"::error::Failed to inject version into app/build.gradle.kts (cnt_code={cnt_code}, cnt_ver={cnt_ver})", file=sys.stderr)
              sys.exit(1)

          gradle_path.write_text(text, encoding="utf-8")
          PY
          git diff app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-parallel --console=plain

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SHOULD_RELEASE: ${{ needs.meta.outputs.should_release }}
        run: |
          set -euo pipefail
          HAS_SIGNING=true
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            HAS_SIGNING=false
          fi

          if [ "$HAS_SIGNING" = "true" ]; then
            trap 'rm -f /tmp/release-signing.jks' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > /tmp/release-signing.jks
            export SIGNING_STORE_FILE=/tmp/release-signing.jks
            ./gradlew assembleRelease --no-parallel --console=plain
          else
            if [ "${SHOULD_RELEASE}" = "true" ]; then
              echo "::error::Publishing release requires ANDROID_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD secrets."
              exit 1
            else
              echo "Signing secrets not configured; running unsigned assembleRelease to verify R8 compilation and packaging."
              ./gradlew assembleRelease --no-parallel --console=plain
            fi
          fi

      - name: Collect Android Release APK
        env:
          SHOULD_RELEASE: ${{ needs.meta.outputs.should_release }}
          SAFE_TAG: ${{ needs.meta.outputs.artifact_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist-android

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist-android/yubrae-${SAFE_TAG}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            if [ "${SHOULD_RELEASE}" = "true" ]; then
              echo "::error::Expected signed app-release.apk for release ${SAFE_TAG}, found only unsigned APK."
              exit 1
            fi
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist-android/yubrae-${SAFE_TAG}-release-unsigned.apk"
          else
            echo "::error::No release APK produced under app/build/outputs/apk/release/"
            exit 1
          fi
          ls -lh dist-android/

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Android Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: yubrae-android-release
          path: dist-android/
          retention-days: 30

  ios:
    name: iOS Test & Release IPA
    runs-on: macos-latest
    needs: [meta]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject target version into iOS project
        if: needs.meta.outputs.should_release == 'true'
        env:
          TARGET_VERSION: ${{ needs.meta.outputs.target_version }}
          TARGET_BUILD_NUMBER: ${{ needs.meta.outputs.target_build_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          target_ver = os.environ["TARGET_VERSION"]
          target_code = os.environ["TARGET_BUILD_NUMBER"]
          proj_path = Path("ios/project.yml")
          text = proj_path.read_text(encoding="utf-8")

          text, cnt_ver = re.subn(
              r'^(\s*MARKETING_VERSION:\s*)"[^"]+"',
              rf'\g<1>"{target_ver}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, cnt_code = re.subn(
              r'^(\s*CURRENT_PROJECT_VERSION:\s*)"?\d+"?',
              rf'\g<1>"{target_code}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if cnt_ver != 1 or cnt_code != 1:
              print(f"::error::Failed to inject version into ios/project.yml (cnt_ver={cnt_ver}, cnt_code={cnt_code})", file=sys.stderr)
              sys.exit(1)

          proj_path.write_text(text, encoding="utf-8")
          PY
          git diff ios/project.yml

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run iOS unit tests on latest available iPhone Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/sim_udid.txt
          import json
          import re
          import subprocess
          import sys

          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)(?:-(\d+))?", runtime)
              if not match:
                  continue
              ver = (int(match.group(1)), int(match.group(2)), int(match.group(3) or 0))
              if ver < (16, 0, 0):
                  continue
              for dev in devices:
                  name = dev.get("name", "")
                  if dev.get("isAvailable", True) and "iPhone" in name:
                      is_se = 1 if "SE" in name else 0
                      nums = [int(n) for n in re.findall(r"\d+", name)]
                      model_num = nums[0] if nums else 0
                      candidates.append((ver, -is_se, model_num, name, dev["udid"], runtime))

          if not candidates:
              print("No available iOS >= 16.0 iPhone simulator found.", file=sys.stderr)
              sys.exit(1)

          candidates.sort(reverse=True)
          best = candidates[0]
          print(f"Selected simulator: {best[3]} ({best[5]}) [{best[4]}]", file=sys.stderr)
          print(best[4])
          PY
          SIM_UDID="$(cat /tmp/sim_udid.txt)"
          rm -f /tmp/sim_udid.txt
          echo "Running YubraeTests on Simulator UDID: ${SIM_UDID}"
          xcodebuild test \
            -project Yubrae.xcodeproj \
            -scheme Yubrae \
            -destination "id=${SIM_UDID}"

      - name: Build iOS Release app and package IPA
        working-directory: ios
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          SAFE_TAG: ${{ needs.meta.outputs.artifact_tag }}
        run: |
          set -euo pipefail
          mkdir -p ../dist-ios

          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ]; then
            # 预留 Apple 正式证书签名扩展入口：
            # 后续接入 Apple Developer 签名时，可在此导入临时 Keychain (.p12 + IOS_P12_PASSWORD)
            # 与 Provisioning Profile，并改用 xcodebuild archive + -exportArchive 输出已签名 IPA。
            echo "Detected IOS_P12_BASE64 and IOS_PROVISION_PROFILE_BASE64; signed archive export hook is reserved, proceeding with unsigned Release IPA."
          fi

          xcodebuild build \
            -project Yubrae.xcodeproj \
            -scheme Yubrae \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_BUNDLE="build/Build/Products/Release-iphoneos/Yubrae.app"
          test -d "${APP_BUNDLE}" || { echo "::error::Missing built app bundle: ${APP_BUNDLE}"; exit 1; }
          plutil -p "${APP_BUNDLE}/Info.plist" | grep -E "CFBundleShortVersionString|CFBundleVersion" || true

          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP_BUNDLE}" Payload/Yubrae.app
          zip -qry "../dist-ios/yubrae-${SAFE_TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh ../dist-ios/

      - name: Upload iOS Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: yubrae-ios-release
          path: dist-ios/
          retention-days: 30

  release:
    name: Publish Dual-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [meta, android, ios]
    if: needs.meta.outputs.should_release == 'true'

    steps:
      - name: Download Android Release artifact
        uses: actions/download-artifact@v4
        with:
          name: yubrae-android-release
          path: dist

      - name: Download iOS Release artifact
        uses: actions/download-artifact@v4
        with:
          name: yubrae-ios-release
          path: dist

      - name: Verify release assets and generate SHA256SUMS.txt
        env:
          SAFE_TAG: ${{ needs.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          EXPECTED_APK="yubrae-${SAFE_TAG}-release.apk"
          EXPECTED_IPA="yubrae-${SAFE_TAG}-ios-unsigned.ipa"

          test -f "dist/${EXPECTED_APK}" || { echo "::error::Missing expected Android APK: ${EXPECTED_APK}"; ls -la dist/; exit 1; }
          test -f "dist/${EXPECTED_IPA}" || { echo "::error::Missing expected iOS IPA: ${EXPECTED_IPA}"; ls -la dist/; exit 1; }

          (
            cd dist
            sha256sum "${EXPECTED_APK}" "${EXPECTED_IPA}" > SHA256SUMS.txt
          )
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.release_tag }}
          files: dist/*
          generate_release_notes: true
